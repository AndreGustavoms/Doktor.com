<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — DoktorDev</title>
  <meta name="theme-color" content="#050914">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/motion.css?v=27">
  <style>
    .not-found { min-height: 100svh; display: grid; place-items: center; padding: 32px; background: #050914; color: #f7f9fc; }
    .not-found-inner { width: min(100%, 760px); }
    .not-found-mark { width: 58px; margin-bottom: 64px; }
    .not-found-code { color: #2f80ff; font: 700 9px var(--mono); letter-spacing: .18em; }
    .not-found h1 { margin: 18px 0 24px; font-size: clamp(72px, 16vw, 190px); font-weight: 620; line-height: .78; letter-spacing: -.09em; }
    .not-found h1 em { color: #2f80ff; font-style: normal; }
    .not-found p { max-width: 430px; color: #8d99ae; font-size: 16px; line-height: 1.65; }
    .not-found a { display: inline-flex; margin-top: 24px; padding: 13px 18px; border: 1px solid #2f80ff; border-radius: 999px; color: #f7f9fc; font-size: 11px; font-weight: 700; text-decoration: none; }
    .not-found a:hover { background: #2f80ff; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <img class="not-found-mark" src="assets/doktordev-mark.svg" alt="DoktorDev">
      <div class="not-found-code">ERROR / 404</div>
      <h1>Não<br><em>encontrado.</em></h1>
      <p>Esse endereço não existe ou foi movido. Volte para o início e continue explorando o laboratório.</p>
      <a href="./">Voltar ao início ↗</a>
    </div>
  </main>
</body>
</html>
