# Hooks de Git — a última linha de defesa contra A2 (segredo no histórico).
# Ver docs/SECURITY.md §4.11.
#
# Este arquivo vive em painel-github/ (não na raiz do repositório Git,
# que é Doktor.com/) — é importado via `extends` no lefthook.yml da
# raiz.
#
# Divisão deliberada entre os dois tipos de comando abaixo:
#
# - gitleaks roda a partir da RAIZ do repositório, sem `root:`, porque
#   segredo commitado em qualquer pasta é igualmente caro de reverter —
#   revogar é a única resposta real. Uma versão anterior desta config
#   colocava `root: painel-github/` também aqui, e o efeito colateral
#   era que o lefthook considerava o comando inaplicável quando nenhum
#   arquivo staged estava sob aquela pasta: um commit tocando só site/
#   passava com "(skip) no matching staged files", sem varredura
#   nenhuma. Caminho da config é explícito (painel-github/.gitleaks.toml)
#   justamente porque o cwd agora é a raiz.
#
# - lint-staged mantém `root:` porque é o eslint de UM projeto Node
#   específico: ele precisa do cwd em painel-github/ para achar
#   node_modules/ e eslint.config.mjs. Restringir por glob ali é
#   correto — arquivos fora daquele projeto não são regidos por aquele
#   eslint. `root:` muda o cwd de execução de `run:` (confirmado
#   empiricamente); {staged_files} continuaria relativo à raiz do repo,
#   por isso o eslint roda sobre o diretório src inteiro em vez da lista
#   de arquivos.

pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose --config painel-github/.gitleaks.toml
    lint-staged:
      root: "painel-github/"
      glob: "painel-github/**/*.{ts,tsx}"
      run: node_modules/.bin/eslint --no-error-on-unmatched-pattern src

pre-push:
  commands:
    gitleaks-full:
      run: gitleaks detect --no-git --redact --config painel-github/.gitleaks.toml
