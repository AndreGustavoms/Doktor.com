name: Validate

on:
  push:
  pull_request:

jobs:
  repo-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-repo.ps1

      - name: Run installer test suites
        shell: pwsh
        run: ./scripts/tests/run-tests.ps1

