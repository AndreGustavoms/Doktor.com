# Publica o site estático do Doktor no GitHub Pages.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que está em andamento para não
# deixar o Pages num estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build motion layer
        working-directory: site
        run: |
          npm ci
          npm run build
      # O artefato é montado por allowlist: copiamos apenas o que deve ser
      # público. Publicar a pasta de trabalho e remover itens depois exige uma
      # lista de exclusão que envelhece mal — todo arquivo novo entra por
      # padrão. Aqui o padrão é o inverso: nada entra sem estar listado.
      - name: Montar artefato apenas com o que é público
        run: |
          mkdir -p dist
          cp site/index.html site/404.html site/projeto.html site/robots.txt site/sitemap.xml site/site.webmanifest dist/
          cp -r site/assets dist/
      # Barreira contra regressão: falha a publicação se algo sensível ou
      # não previsto entrar no diretório publicado.
      - name: Validar conteúdo do artefato
        run: |
          if find dist -name '.*' -o -name '*.map' -o -name '*.bak' -o -name '*.old' \
               -o -name '*.orig' -o -name '*.save' -o -name '*.sw?' -o -name '*.sql' \
               -o -name '*.log' -o -name '*.zip' -o -name '*~' | grep -q .; then
            echo "Arquivo sensível encontrado no artefato:" >&2
            find dist -name '.*' -o -name '*.map' -o -name '*.bak' -o -name '*.old' \
              -o -name '*.orig' -o -name '*.save' -o -name '*.sw?' -o -name '*.sql' \
              -o -name '*.log' -o -name '*.zip' -o -name '*~' >&2
            exit 1
          fi
          for proibido in package.json package-lock.json server.mjs README.md src; do
            if [ -e "dist/$proibido" ]; then
              echo "Item não público no artefato: $proibido" >&2
              exit 1
            fi
          done
          # Contrapartida da allowlist: ela não pode deixar cair, em silêncio,
          # uma página que deveria ser pública. Toda página na raiz de site/
          # precisa estar no artefato — se faltar, a publicação falha aqui em
          # vez de servir 404 em produção.
          for publico in site/*.html site/*.webmanifest; do
            [ -e "$publico" ] || continue
            nome=$(basename "$publico")
            if [ ! -e "dist/$nome" ]; then
              echo "Página pública ausente do artefato: $nome" >&2
              echo "Inclua-a no passo 'Montar artefato apenas com o que é público'." >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
